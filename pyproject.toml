[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boq-diff"
version = "0.1.0"
description = "工程量清单版本对比工具 / Compare two versions of a bill of quantities and generate a diff report"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "zjh2066076218" }]
keywords = ["bill-of-quantities", "工程量清单", "construction", "cost-engineering", "diff", "excel"]
dependencies = ["openpyxl>=3.1"]

[project.scripts]
boq-diff = "boq_diff.cli:main"

[tool.setuptools.packages.find]
include = ["boq_diff*"]
